name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      working-directory: calm-quest-android
      run: |
        npm install
        npm install -D typescript

    - name: Sync Capacitor
      working-directory: calm-quest-android
      run: npx cap sync android

    - name: Build debug APK
      working-directory: calm-quest-android
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: calm-quest-android/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
