name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'corretto'
        java-version: '11'

    - name: Install dependencies
      run: |
        cd calm-quest-android
        npm install

    - name: Sync Capacitor
      run: |
        cd calm-quest-android
        npx cap sync android

    - name: Build debug APK
      run: |
        cd calm-quest-android/android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: calm-quest-android/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
